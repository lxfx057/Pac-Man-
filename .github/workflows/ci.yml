name: Build script checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build script
        run: bash -n build.sh
      - name: Check source files
        run: |
          for file in inherit.js sound.js random.js game.js direction.js Map.js colors.js mapgen.js atlas.js renderers.js hud.js galagaStars.js Button.js Menu.js inGameMenu.js sprites.js Actor.js Ghost.js Player.js actors.js targets.js ghostCommander.js ghostReleaser.js elroyTimer.js energizer.js fruit.js executive.js states.js input.js cutscenes.js maps.js vcr.js main.js; do
            test -f "src/$file" || { echo "Missing src/$file"; exit 1; }
          done
